<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="/EmployeeDash/img/logo/MGnewlogo.png">
  <title>Schedule — MG Client Portal</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="/EmployeeDash/assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="/EmployeeDash/css/employee-portal.css">
  <link rel="stylesheet" href="/EmployeeDash/css/mg-employee.css">
  <link rel="stylesheet" href="/css/mg-ops.css">
</head>
<body class="g-sidenav-show bg-gray-100 mg-employee-app" data-client-page="schedule">
  <div id="client-sidebar-root"></div>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mt-3 mg-navbar-emp">
      <div class="container-fluid emp-navbar-toolbar py-2 px-3">
        <a href="javascript:;" class="nav-link text-body p-0 d-xl-none flex-shrink-0 emp-navbar-menu-btn" id="iconNavbarSidenav" aria-label="Open navigation menu" role="button">
          <div class="sidenav-toggler-inner">
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
          </div>
        </a>
        <div class="emp-navbar-titles min-w-0">
          <h6 class="font-weight-bolder mb-0 text-truncate">Staffing schedule</h6>
          <span class="text-sm text-muted" id="client-page-title"></span>
          <span class="text-sm text-muted d-block" id="client-org-name"></span>
        </div>
        <span class="nav-link text-body mb-0 text-sm cursor-pointer" id="client-logout" role="button">
          <i class="fas fa-right-from-bracket me-1"></i> Sign out
        </span>
      </div>
    </nav>
    <div class="container-fluid py-4 px-3">
      <div id="mg-ops-alert" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>
      <div id="mg-buildings" class="mb-3"></div>
      <p class="text-sm text-muted mb-3">Click a shift to see who is on site and any photos from that visit.</p>
      <div id="mg-today" class="mb-3"></div>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <select id="mg-building" class="form-control form-control-sm" style="max-width:220px;"><option value="">All buildings</option></select>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-view-week">Week</button>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-view-list">List</button>
      </div>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-prev">Prev</button>
        <strong id="mg-range"></strong>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-next">Next</button>
      </div>
      <div id="mg-cal"></div>
      <div class="modal fade" id="mg-occ-modal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Shift photos</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="mg-occ-body"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../js/client-auth.js"></script>
  <script src="../js/client-nav.js"></script>
  <script src="/EmployeeDash/assets/js/core/popper.min.js"></script>
  <script src="/EmployeeDash/assets/js/core/bootstrap.min.js"></script>
  <script src="/js/mg-shift-photos.js"></script>
  <script src="routes/schedule-page.js"></script>
</body>
</html>
