<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../img/logo/MGnewlogo.png">
  <title>Photo documentation — MG Operations</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="../assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/gradient.css">
  <link rel="stylesheet" href="../css/mg-admin.css">
  <link rel="stylesheet" href="/css/mg-ops.css">
</head>
<body class="g-sidenav-show bg-gray-100 mg-admin-app">
  <div id="mg-sidebar-root"></div>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mg-navbar-clean">
      <div class="container-fluid py-1 px-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
            <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="dashboard.html">Home</a></li>
            <li class="breadcrumb-item text-sm text-dark active">Photo docs</li>
          </ol>
          <h6 class="font-weight-bolder mb-0">Photo documentation</h6>
        </nav>
        <div class="ms-md-auto d-flex align-items-center">
          <span class="text-sm font-weight-bold" data-mg-user-name></span>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div class="mg-page-hero">
        <h1>Site photos</h1>
        <p>Photos are attached to a shift. Open a shift on Staffing to see a camera count, or filter here by building and shift date.</p>
      </div>
      <div id="mg-ops-alert" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>
      <div class="mg-toolbar">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <select id="mg-d-building" class="form-select form-select-sm" style="max-width:220px;"><option value="">All buildings</option></select>
          <input type="date" class="form-control form-control-sm" id="mg-d-from" style="max-width:160px;">
          <input type="date" class="form-control form-control-sm" id="mg-d-to" style="max-width:160px;">
          <button type="button" class="btn btn-sm btn-outline-dark mb-0" id="mg-d-apply">Apply</button>
        </div>
        <span class="text-xs text-muted" id="mg-d-meta"></span>
      </div>
      <div id="mg-d-list"></div>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-d-prev">Prev</button>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-0" id="mg-d-next">Next</button>
      </div>
    </div>
    <div class="modal fade" id="mg-d-lightbox" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Photo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <img id="mg-d-full" alt="" class="img-fluid rounded">
          </div>
          <div class="modal-footer">
            <a class="btn btn-sm bg-gradient-dark mb-0 d-none" id="mg-d-download" href="#" download>Download</a>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-0" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      MgAdminShell.init({ page: 'documentation' });
    });
  </script>
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="routes/documentation-page.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js?v=1.0.7"></script>
</body>
</html>
