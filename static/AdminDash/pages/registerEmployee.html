<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../img/logo/MGnewlogo.png">
  <title>Register employee — MG Operations</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="../assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/gradient.css">
  <link rel="stylesheet" href="../css/mg-admin.css">
</head>
<body class="g-sidenav-show bg-gray-100 mg-admin-app">
  <div id="mg-sidebar-root"></div>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mg-navbar-clean">
      <div class="container-fluid py-1 px-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
            <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="dashboard.html">Home</a></li>
            <li class="breadcrumb-item text-sm text-dark active">Register employee</li>
          </ol>
          <h6 class="font-weight-bolder mb-0">New team member</h6>
        </nav>
        <div class="ms-md-auto d-flex align-items-center">
          <span class="text-sm font-weight-bold" data-mg-user-name></span>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4">
      <div id="mg-reg-alert" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>

      <div class="mg-page-hero">
        <h1 id="regWelcome">Register employee</h1>
        <p>Create login credentials for field and office staff. Grant admin only to trusted operators.</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card mg-section-card">
            <div class="card-header bg-gradient2 text-white text-center py-3">
              <h6 class="mb-0 text-white">Employee registration</h6>
            </div>
            <div class="card-body p-4">
              <form id="registrationForm" role="form">
                <div class="mb-3">
                  <label class="form-label text-xs">Full name</label>
                  <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Full name" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-xs">Employee ID #</label>
                  <input type="text" id="idNumber" name="idNumber" class="form-control" placeholder="ID number" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-xs">Email</label>
                  <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-xs">Username</label>
                  <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-xs">Password</label>
                  <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="mb-3">
                  <label class="form-label text-xs">Pay rate</label>
                  <input type="text" id="payRate" name="payRate" class="form-control" style="max-width:120px" placeholder="e.g. 25 or 22.50" maxlength="32" required>
                </div>
                <div class="form-check form-check-info text-start mb-3">
                  <input class="form-check-input" type="checkbox" id="adminCheckbox">
                  <label class="form-check-label" for="adminCheckbox">Grant <strong>admin</strong> access to this account</label>
                </div>
                <button type="button" class="btn bg-gradient-dark w-100 mb-2" id="registerButton" onclick="submitForm()">Register employee</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      MgAdminShell.init({ page: 'register' });
      var stored = localStorage.getItem('userInfo');
      if (stored) {
        try {
          var u = JSON.parse(stored);
          var el = document.getElementById('regWelcome');
          if (el && u.store_name) el.textContent = 'Register employee — ' + u.store_name;
        } catch (e) {}
      }
    });
  </script>
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="./routes/newEmployee.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js?v=1.0.7"></script>
</body>
</html>
