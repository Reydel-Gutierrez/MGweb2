            style="background-image: url('../assets/img/curved-images/curved14.jpg');">
            <span class="mask bg-gradient-dark opacity-6"></span>
            <div class="container">
               <div class="row justify-content-center">
                  <div class="col-lg-5 text-center mx-auto">
                     <h1 id="dashboardName" class="text-white mb-2 mt-5"></p></h1>
                     <p class="text-lead text-white">Use the following registration form to add a new MG Employee.</p>
                  </div>
               </div>
            </div>

         <div class="container">
            <div class="row mt-lg-n12 mt-md-n11 mt-n10">

                     <div class="card-header text-center pt-4">
                        <h5>Register</h5>
                     </div>
                     <div class="card-body">
                        <form id="registrationForm" role="form text-left" >
                        <div class="mb-3">
                          <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Full Name">
                        </div>
                        <div class="mb-3">
                          <input type="text" id="idNumber" name="idNumber" class="form-control" placeholder="ID#" required>
                         </div>
                         <div class="mb-3">
                          <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
                         </div>
                         <div class="mb-3">
                          <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
                         </div>
                         <div class="mb-3">
                          <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                         </div>
                         <div class="mb-3">
                          <input type="text" id="payRate" name="payRate" class="form-control" style="max-width: 100px;" placeholder="Pay Rate" max-width="60" maxlength="2" required >
                         </div>
                           <!-- ... (other form fields) ... -->
                           <div class="form-check form-check-info text-left">
                            <input class="form-check-input" type="checkbox" value="" id="adminCheckbox" placeholder="Admin Privileges">
                            <label class="form-check-label" for="adminCheckbox">This user has <a href="javascript:;" class="text-dark font-weight-bolder" id="adminLink">Admin Privileges?</a></label>
                        </div>
                           <div class="text-center">
                            <button type="button" class="btn bg-gradient-dark w-100 my-4 mb-2" id="registerButton" onclick="submitForm()">Register</button>
                           </div>
                        </form>
                     </div>
                  </div>
               </div>

   <!-- Core JS Files -->

   <script>
    
      document.addEventListener('DOMContentLoaded', function () {
      // Retrieve user information from localStorage
      const storedUserInfo = localStorage.getItem("userInfo");
  
      if (storedUserInfo) {
        const userInfo = JSON.parse(storedUserInfo);
  
        // Display user information on the dashboard
        const dashboardNameElement = document.querySelector('#dashboardName');
        dashboardNameElement.textContent = `Hi, ${userInfo.store_name || ''}!`;
        
      }
    });
      
    </script>

         }
         Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
