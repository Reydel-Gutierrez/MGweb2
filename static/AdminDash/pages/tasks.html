<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../img/logo/MGnewlogo.png">
  <title>Tasks &amp; schedule — MG Operations</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="../assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/gradient.css">
  <link rel="stylesheet" href="../assets/calendar/style.css">
  <link rel="stylesheet" href="../css/mg-admin.css">
  <style>
    .calendar .row > .col { padding: 10px; border: 1px solid #dee2e6; text-align: center; }
    .calendar .row:nth-child(3) > .col { font-weight: bold; }
    .calendar .row > .col:not(:last-child) { border-right: none; }
  </style>
</head>
<body class="g-sidenav-show bg-gray-100 mg-admin-app">
  <div id="mg-sidebar-root"></div>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mg-navbar-clean">
      <div class="container-fluid py-1 px-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
            <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="dashboard.html">Home</a></li>
            <li class="breadcrumb-item text-sm text-dark active">Tasks</li>
          </ol>
          <h6 class="font-weight-bolder mb-0">Tasks &amp; schedule</h6>
        </nav>
        <div class="ms-md-auto d-flex align-items-center">
          <span class="text-sm font-weight-bold" data-mg-user-name></span>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4">
      <div class="mg-page-hero">
        <h1>Field tasks &amp; calendar</h1>
        <p>Schedule work and track operational tasks. The calendar is a month view for planning; the table lists all scheduled items.</p>
      </div>

      <div id="mg-task-alert" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>

      <div class="row">
        <div class="col-lg-7 mb-4">
          <div class="card mg-section-card h-100">
            <div class="card-header"><h6>Task schedule</h6></div>
            <div class="card-body">
              <div class="calendar">
                <div class="row border-bottom pb-2 mb-3">
                  <div class="col text-center">
                    <h2 id="monthAndYear" class="h5"></h2>
                  </div>
                </div>
                <div class="row d-none d-lg-flex pb-2" id="weekday-header"></div>
                <div id="calendar-body" class="calendar-body"></div>
                <div class="row pt-3">
                  <div class="col text-center">
                    <button id="previous" type="button" class="btn btn-outline-primary btn-sm">Previous</button>
                    <button id="next" type="button" class="btn btn-outline-primary btn-sm">Next</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5 mb-4">
          <div class="card mg-section-card mb-3">
            <div class="card-header"><h6>Add task</h6></div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label text-xs">Title</label>
                <input type="text" class="form-control" id="taskTitle" placeholder="e.g. Site inspection">
              </div>
              <div class="mb-2">
                <label class="form-label text-xs">Date</label>
                <input type="date" class="form-control" id="taskDate">
              </div>
              <button type="button" id="mg-task-add-btn" class="btn btn-sm bg-gradient-dark mb-0">Add task</button>
            </div>
          </div>
          <div class="card mg-section-card">
            <div class="card-header"><h6>All tasks</h6></div>
            <div class="card-body p-0">
              <div class="table-responsive mg-table-wrap">
                <table class="table mg-data-table mb-0" id="mg-tasks-table">
                  <thead>
                    <tr>
                      <th class="text-xs">ID</th>
                      <th class="text-xs">Title</th>
                      <th class="text-xs">Date</th>
                      <th class="text-xs text-end"> </th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="mg-task-edit-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="mg-task-edit-id" value="">
            <div class="mb-2">
              <label class="form-label text-xs">Title</label>
              <input type="text" class="form-control" id="mg-task-edit-title">
            </div>
            <div class="mb-2">
              <label class="form-label text-xs">Date</label>
              <input type="date" class="form-control" id="mg-task-edit-date">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-outline-secondary mb-0" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm bg-gradient-dark mb-0" id="mg-task-save-btn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      MgAdminShell.init({ page: 'tasks' });
    });
  </script>
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/calendar/calender.js"></script>
  <script src="routes/tasks-page.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js?v=1.0.7"></script>
</body>
</html>
