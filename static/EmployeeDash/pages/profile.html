<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../img/logo/MGnewlogo.png">
  <title>Profile — MG Workforce</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../assets/css/gradient.css">
  <link href="../assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mg-employee.css">
  <link rel="stylesheet" href="../css/employee-portal.css">
</head>
<body class="g-sidenav-show bg-gray-100 mg-employee-app" data-emp-page="profile">
  <div id="emp-sidebar-root"></div>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mt-3 mg-navbar-emp">
      <div class="container-fluid emp-navbar-toolbar py-2 px-3">
        <a href="javascript:;" class="nav-link text-body p-0 d-xl-none flex-shrink-0 emp-navbar-menu-btn" id="iconNavbarSidenav" aria-label="Open navigation menu" role="button">
          <div class="sidenav-toggler-inner">
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
          </div>
        </a>
        <div class="emp-navbar-titles min-w-0">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
              <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Profile</li>
            </ol>
            <h6 class="font-weight-bolder mb-0 text-truncate" id="emp-page-title">Account</h6>
          </nav>
        </div>
        <div class="emp-navbar-actions flex-shrink-0">
          <span class="nav-link text-body mb-0 text-sm emp-logout cursor-pointer" id="emp-logout" role="button" tabindex="0">
            <i class="fas fa-right-from-bracket me-1"></i> Sign out
          </span>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4 px-3 px-md-4">
      <div class="card" style="max-width: 36rem;">
        <div class="card-header pb-0 bg-gradient1 text-white">
          <h6 class="text-white mb-0">Your information</h6>
          <p class="text-xs text-white mb-0 opacity-8">Read-only. Contact the office to update your records.</p>
        </div>
        <div class="card-body">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between flex-wrap border-0 px-0">
              <span class="text-muted text-sm">Full name</span>
              <span class="text-sm font-weight-bold text-end" id="prof-name">—</span>
            </li>
            <li class="list-group-item d-flex justify-content-between flex-wrap border-0 px-0">
              <span class="text-muted text-sm">Username</span>
              <span class="text-sm font-weight-bold text-end" id="prof-user">—</span>
            </li>
            <li class="list-group-item d-flex justify-content-between flex-wrap border-0 px-0">
              <span class="text-muted text-sm">Email</span>
              <span class="text-sm font-weight-bold text-end text-break" id="prof-email">—</span>
            </li>
            <li class="list-group-item d-flex justify-content-between flex-wrap border-0 px-0">
              <span class="text-muted text-sm">ID number</span>
              <span class="text-sm font-weight-bold text-end" id="prof-id">—</span>
            </li>
            <li class="list-group-item d-flex justify-content-between flex-wrap border-0 px-0">
              <span class="text-muted text-sm">Pay rate on file</span>
              <span class="text-sm font-weight-bold text-end" id="prof-rate">—</span>
            </li>
          </ul>
          <p class="text-xs text-muted mt-3 mb-0" id="prof-err"></p>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/employee-auth.js"></script>
  <script src="../js/employee-nav.js"></script>
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js?v=1.0.7"></script>
  <script src="routes/profile-page.js"></script>
</body>
</html>
