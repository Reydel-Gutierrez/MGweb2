<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../img/logo/MGnewlogo.png">
  <title>Time &amp; punches — MG Workforce</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../assets/css/gradient.css">
  <link href="../assets/css/soft-ui-dashboard.css?v=1.0.7" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mg-employee.css">
  <link rel="stylesheet" href="../css/employee-portal.css">
</head>
<body class="g-sidenav-show bg-gray-100 mg-employee-app" data-emp-page="punches">
  <div id="emp-sidebar-root"></div>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl mt-3 mg-navbar-emp">
      <div class="container-fluid emp-navbar-toolbar py-2 px-3">
        <a href="javascript:;" class="nav-link text-body p-0 d-xl-none flex-shrink-0 emp-navbar-menu-btn" id="iconNavbarSidenav" aria-label="Open navigation menu" role="button">
          <div class="sidenav-toggler-inner">
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
            <i class="sidenav-toggler-line"></i>
          </div>
        </a>
        <div class="emp-navbar-titles min-w-0">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0">
              <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Time &amp; punches</li>
            </ol>
            <h6 class="font-weight-bolder mb-0 text-truncate" id="emp-page-title">Punch history</h6>
          </nav>
        </div>
        <div class="emp-navbar-actions flex-shrink-0">
          <span class="nav-link text-body mb-0 text-sm emp-logout cursor-pointer" id="emp-logout" role="button" tabindex="0">
            <i class="fas fa-right-from-bracket me-1"></i> Sign out
          </span>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4 px-3 px-md-4">
      <div id="emp-punch-alert" class="alert alert-warning text-sm d-none" role="alert"></div>

      <div class="card emp-filter-bar mb-3">
        <div class="card-body py-3">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label text-xs text-muted mb-1">Search (date or time)</label>
              <input type="search" class="form-control form-control-sm" id="emp-ph-filter-q" placeholder="e.g. March or 8:30">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label text-xs text-muted mb-1">From</label>
              <input type="date" class="form-control form-control-sm" id="emp-ph-from">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label text-xs text-muted mb-1">To</label>
              <input type="date" class="form-control form-control-sm" id="emp-ph-to">
            </div>
            <div class="col-12 col-md-2">
              <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="emp-ph-clear">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card mg-section-card">
        <div class="card-header pb-2">
          <h6>All punch events</h6>
          <p class="text-xs text-muted mb-0 font-weight-normal" style="text-transform: none; letter-spacing: normal;">Newest first. Use filters to narrow the list.</p>
        </div>
        <div class="card-body px-0 pt-0">
          <div class="table-responsive mg-table-wrap emp-table-wrap d-none d-md-block px-3">
            <table class="table align-items-center mb-0 mg-data-table">
              <thead>
                <tr>
                  <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Date</th>
                  <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Time</th>
                  <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Action</th>
                </tr>
              </thead>
              <tbody id="emp-ph-tbody"></tbody>
            </table>
          </div>
          <div class="d-md-none px-3 pb-3" id="emp-ph-cards"></div>
          <p class="text-center text-sm text-muted py-4 mb-0 d-none" id="emp-ph-empty">No punches match these filters.</p>
        </div>
      </div>

      <p class="text-xs text-muted mt-3 mb-0">
        Need a correction? <a href="requests.html">Submit a request</a> with the date and time that should be fixed.
      </p>
    </div>
  </main>

  <script src="../js/employee-auth.js"></script>
  <script src="../js/employee-nav.js"></script>
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js?v=1.0.7"></script>
  <script src="routes/punchHistory-page.js"></script>
</body>
</html>
