<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees Portal</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <style>
    body {
      background-color: #e5e3e3;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .form-control {
      width: 200px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Employees Portal</h1>
    <div class="form-group">
      <label for="cleaningCode">Cleaning Services Personnel:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="cleaningCode" placeholder="Insert Code">
        <div class="input-group-append">
          <button class="btn btn-primary" type="button">Submit</button>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label for="facilityCode">Facility Operators:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="facilityCode" placeholder="Insert Code">
        <div class="input-group-append">
          <button class="btn btn-primary" type="button">Submit</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
